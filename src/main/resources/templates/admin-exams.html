<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exams — HEI admin</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout :: nav}"></div>

<main class="page">
  <p class="crumb"><a th:href="@{/ui/admin/courses}">← Back to the courses</a></p>

  <h1 th:if="${course != null}" th:text="${course.ref + ' — ' + course.title}">PROG1 — Programming 1</h1>
  <h1 th:if="${course == null}">Exams</h1>
  <p class="subtitle" th:if="${course != null}"
     th:text="${course.semester.ref + ' · ' + course.credits + ' credits'}">S1 · 6 credits</p>

  <p class="error" th:if="${error}" th:text="${error}">Something went wrong</p>

  <div th:if="${course != null}">
    <h2>Add an exam</h2>
    <form method="post" th:action="@{'/ui/admin/courses/' + ${course.id} + '/exams'}" class="card-form">
      <div class="field-row">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" required placeholder="Final exam">
        </div>
        <div class="field">
          <label for="date_exam">Date</label>
          <input id="date_exam" name="date_exam" type="date" required>
        </div>
        <div class="field">
          <label for="coefficient">Coefficient</label>
          <input id="coefficient" name="coefficient" type="number" step="0.1" min="0.1" required value="1">
          <span class="hint">Strictly above zero: an exam that weighs nothing is not an exam.</span>
        </div>
      </div>
      <button type="submit">Create the exam</button>
    </form>

    <h2>Exams of this course</h2>
    <p class="empty" th:if="${#lists.isEmpty(exams)}">No exam scheduled for this course yet.</p>

    <table th:unless="${#lists.isEmpty(exams)}">
      <thead>
      <tr>
        <th>Title</th>
        <th>Date</th>
        <th class="num">Coefficient</th>
        <th>Grades</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="e : ${exams}">
        <td th:text="${e.title}">Final exam</td>
        <td th:text="${#strings.substring(e.dateExam, 0, 10)}">2026-01-15</td>
        <td class="num" th:text="${e.coefficient}">1</td>
        <td>
          <a th:href="@{'/ui/admin/exams/' + ${e.id} + '/grades'}">Enter grades</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
